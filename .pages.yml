media:
  - name: blog_images
    label: ブログ画像
    input: assets/images/blog
    output: /SoloCreate-portfolio-site/assets/images/blog
    rename: safe
    categories: [image]

content:
  - name: blog_posts
    label: ブログ記事
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{date}-{slug}.md"
      field: create
    view:
      fields: [title, date, published]
      primary: title
      sort: [date, title]
      search: [title, excerpt, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: URL名
        type: string
        required: true
        description: 半角英数字とハイフンで入力します（例：new-game-release）
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: 半角小文字・数字・ハイフンだけで入力してください
      - name: date
        label: 公開日
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: excerpt
        label: 一覧に表示する概要
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 180
      - name: tags
        label: タグ
        type: string
        list: true
        required: true
        description: 「ゲーム制作」「Web制作」のように追加します
      - name: cover_image
        label: カバー画像
        type: image
        required: false
        options:
          media: blog_images
          path: assets/images/blog
          rename: safe
          extensions: [jpg, jpeg, png, webp]
      - name: visual_label
        label: 画像がない場合のラベル
        type: string
        required: false
        default: SC / NOTE
      - name: featured
        label: 一覧で大きく表示
        type: boolean
        default: false
      - name: cta_text
        label: 関連リンクの説明
        type: text
        required: false
      - name: cta_label
        label: 関連リンクのボタン名
        type: string
        required: false
      - name: cta_url
        label: 関連リンクURL
        type: string
        required: false
      - name: body
        label: 本文
        type: rich-text
        required: true
        options:
          format: markdown
          media: blog_images
          path: assets/images/blog
          rename: safe
          switcher: false

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "ブログ記事を作成: {filename}"
      update: "ブログ記事を更新: {filename}"
      delete: "ブログ記事を削除: {filename}"
      rename: "ブログ記事名を変更: {oldFilename} → {newFilename}"

