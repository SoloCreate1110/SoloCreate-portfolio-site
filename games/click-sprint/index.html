<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click Sprint | SoloCreate</title>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <style>
      body {
        min-height: 100vh;
        background: #f7f5ef;
      }

      .game-shell {
        display: grid;
        min-height: calc(100vh - 76px);
        padding: clamp(24px, 6vw, 72px);
        place-items: center;
      }

      .game-board {
        width: min(760px, 100%);
        padding: clamp(22px, 5vw, 42px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-strong);
        box-shadow: var(--shadow);
      }

      .score-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 24px 0;
      }

      .score-box {
        padding: 16px;
        border-radius: 8px;
        background: #f0eee6;
      }

      .score-box span {
        display: block;
        font-size: 2rem;
        font-weight: 900;
        line-height: 1.1;
      }

      .click-target {
        width: 100%;
        min-height: 210px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-size: clamp(1.35rem, 5vw, 2.5rem);
        font-weight: 900;
      }

      .click-target:disabled {
        background: #8a8a80;
        cursor: default;
      }

      .game-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      @media (max-width: 640px) {
        .score-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../index.html">
        <span class="brand-mark">SC</span>
        <span>SoloCreate</span>
      </a>
      <nav class="site-nav" aria-label="Game navigation">
        <a href="../../index.html#games">Games</a>
        <a href="../../index.html#news">News</a>
      </nav>
    </header>

    <main class="game-shell">
      <section class="game-board" aria-labelledby="game-title">
        <p class="eyebrow">Browser Game</p>
        <h1 id="game-title">Click Sprint</h1>
        <p class="hero-lead">
          10秒間で何回クリックできるかを測るミニゲームです。
        </p>

        <div class="score-row" aria-live="polite">
          <div class="score-box">
            <span id="score">0</span>
            Score
          </div>
          <div class="score-box">
            <span id="time">10.0</span>
            Seconds
          </div>
          <div class="score-box">
            <span id="best">0</span>
            Best
          </div>
        </div>

        <button class="click-target" id="target" type="button" disabled>
          Start を押してください
        </button>

        <div class="game-actions">
          <button class="button primary" id="start" type="button">Start</button>
          <a class="button ghost" href="../../index.html#games">戻る</a>
        </div>
      </section>
    </main>

    <script>
      const duration = 10;
      const score = document.getElementById("score");
      const time = document.getElementById("time");
      const best = document.getElementById("best");
      const target = document.getElementById("target");
      const start = document.getElementById("start");
      let count = 0;
      let remaining = duration;
      let timer = null;

      best.textContent = localStorage.getItem("clickSprintBest") || "0";

      const finish = () => {
        clearInterval(timer);
        timer = null;
        target.disabled = true;
        target.textContent = "Finish";
        start.disabled = false;
        const bestScore = Math.max(Number(best.textContent), count);
        best.textContent = String(bestScore);
        localStorage.setItem("clickSprintBest", String(bestScore));
      };

      start.addEventListener("click", () => {
        count = 0;
        remaining = duration;
        score.textContent = "0";
        time.textContent = remaining.toFixed(1);
        target.disabled = false;
        target.textContent = "Click";
        start.disabled = true;

        timer = setInterval(() => {
          remaining = Math.max(0, remaining - 0.1);
          time.textContent = remaining.toFixed(1);
          if (remaining <= 0) {
            finish();
          }
        }, 100);
      });

      target.addEventListener("click", () => {
        if (!timer) return;
        count += 1;
        score.textContent = String(count);
      });
    </script>
  </body>
</html>
